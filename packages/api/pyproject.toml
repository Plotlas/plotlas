[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-viz-api"
version = "0.1.0"
description = "image-viz FastAPI service (skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "email-validator",      # required by pydantic EmailStr (auth.SignupRequest); approved 2026-05-29
    "pyarrow",
    "duckdb",
    "rq",
    "redis",
    "python-multipart",
    "PyJWT",
    "argon2-cffi",
    "SQLAlchemy",
    "aiosqlite",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",                # required by fastapi.testclient.TestClient (test-only)
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
